plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets.main.java {
    exclude 'dev/boxadactle/macrocraft/neoforge/command/**'
    exclude 'dev/boxadactle/macrocraft/neoforge/MacrocraftCommand.java'
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation("boxlib:neoforge:${rootProject.boxlib_version}") { transitive = false }

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
}

jar {
    from(zipTree(shadowJar.archiveFile))
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
