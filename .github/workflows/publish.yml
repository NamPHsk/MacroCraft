name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release jars
        run: bash ./gradlew build --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find fabric/build/libs neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*')
          gh release create v4.0.0 "${files[@]}" --target "$GITHUB_SHA" --title "MacroCraft 4.0.0 - Minecraft 26.2" --notes "MacroCraft 4.0.0 ported to Minecraft Java Edition 26.2. Fabric and NeoForge builds are attached."
