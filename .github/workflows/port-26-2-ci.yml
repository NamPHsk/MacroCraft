name: Port 26.2 CI

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  build-port:
    if: github.event_name != 'issues' || github.event.issue.title == 'trigger: port-26.2-ci'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: port-26.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload Fabric jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macrocraft-26.2-fabric
          path: fabric/build/libs/*.jar

      - name: Upload NeoForge jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macrocraft-26.2-neoforge
          path: neoforge/build/libs/*.jar
