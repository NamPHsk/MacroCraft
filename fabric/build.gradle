plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets.main.java {
    exclude 'dev/boxadactle/macrocraft/fabric/command/**'
    exclude 'dev/boxadactle/macrocraft/fabric/MacrocraftCommand.java'
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    implementation("dev.boxadactle:Boxlib-fabric:${rootProject.boxlib_version}") { transitive = false }
    implementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive = true }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
}

jar {
    from(zipTree(shadowJar.archiveFile))
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
